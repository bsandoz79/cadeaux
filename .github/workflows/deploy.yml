# Tests, build, puis envoi sur o2switch (cadeaux.bsandoz.fr) en FTPS avec lftp.
# Même méthode que Chope ton chargeur et Perfect Clean.
# À régler dans GitHub → Settings → Secrets and variables → Actions → Secrets :
#   FTP_USERNAME, FTP_PASSWORD : compte FTP limité au dossier du sous-domaine (ex. cadeaux@bsandoz.fr)
#   FTP_SERVER (facultatif)    : muguet.o2switch.net par défaut
#   FTP_DIR (facultatif)       : dossier d'envoi vu par ce compte, sa racine par défaut
#   DB_NAME, DB_USER, DB_PASSWORD : base MySQL créée dans cPanel (écrits dans api/config.local.php, jamais versionné)
name: Déploiement o2switch

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-o2switch
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: API – tests
        working-directory: api
        run: |
          composer install --no-interaction --no-progress
          vendor/bin/phpunit

      - name: Site – lint, tests, build
        working-directory: front
        run: |
          npm ci
          npm run lint
          npm run test
          npm run build

      - name: Extension Chrome – archive à télécharger depuis le site
        run: cd extension && zip -qr ../front/dist/extension-cadeaux.zip . -x "*.d.ts"

      - name: Parcours dans un vrai navigateur (téléphone et ordinateur)
        working-directory: front
        env:
          CI: 'true'
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
          # La base de test et sa configuration ne partent jamais en ligne.
          rm -rf ../api/var ../api/config.local.php

      - name: API – dépendances de production et configuration
        working-directory: api
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          # Facultatifs : sans eux, le bouton « Continuer avec Google » n'apparaît pas.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          manquants=""
          [ -n "$DB_NAME" ] || manquants="$manquants DB_NAME"
          [ -n "$DB_USER" ] || manquants="$manquants DB_USER"
          [ -n "$DB_PASSWORD" ] || manquants="$manquants DB_PASSWORD"
          if [ -n "$manquants" ]; then
            echo "::error::Secrets GitHub manquants :$manquants (Settings → Secrets and variables → Actions → onglet Secrets)."
            exit 1
          fi
          composer install --no-dev --optimize-autoloader --no-interaction --no-progress
          # Valeurs échappées par PHP lui-même (var_export) : un mot de passe avec des guillemets ne casse rien.
          php -r 'file_put_contents("config.local.php", "<?php\n\nreturn " . var_export([
            "dsn" => "mysql:host=localhost;dbname=" . trim(getenv("DB_NAME")) . ";charset=utf8mb4",
            "utilisateur" => trim(getenv("DB_USER")),
            "motDePasse" => rtrim(getenv("DB_PASSWORD"), "\r\n"),
            "expediteur" => "Cadeaux <cadeaux@bsandoz.fr>",
            "google" => ["id" => trim((string) getenv("GOOGLE_CLIENT_ID")), "secret" => trim((string) getenv("GOOGLE_CLIENT_SECRET"))],
          ], true) . ";\n");'

      - name: Envoi FTPS vers o2switch
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          manquants=""
          [ -n "$FTP_USERNAME" ] || manquants="$manquants FTP_USERNAME"
          [ -n "$FTP_PASSWORD" ] || manquants="$manquants FTP_PASSWORD"
          if [ -n "$manquants" ]; then
            echo "::error::Secrets GitHub manquants :$manquants (Settings → Secrets and variables → Actions → onglet Secrets)."
            exit 1
          fi
          FTP_SERVER=$(printf '%s' "${FTP_SERVER:-muguet.o2switch.net}" | tr -d '[:space:]')
          FTP_USERNAME=$(printf '%s' "$FTP_USERNAME" | tr -d '[:space:]')
          FTP_PASSWORD=$(printf '%s' "$FTP_PASSWORD" | tr -d '\r\n')
          FTP_DIR=$(printf '%s' "${FTP_DIR:-.}" | tr -d '[:space:]')
          echo "Serveur : $FTP_SERVER · compte : $FTP_USERNAME · dossier : $FTP_DIR"
          sudo apt-get update -qq > /dev/null && sudo apt-get install -y -qq lftp > /dev/null
          # Intermédiaires Let's Encrypt absents côté serveur : chaîne reconstituée, certificat toujours vérifié.
          # TLS 1.2 : en TLS 1.3, lftp (gnutls) échoue sur le canal de données.
          # L'API d'abord, puis le site (tout sauf les pages HTML, puis les pages) : rien ne pointe vers un fichier absent.
          sh .github/chaine-ftps.sh "$FTP_SERVER" "$RUNNER_TEMP/chaine-ftps.pem"
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "
            set ssl:ca-file $RUNNER_TEMP/chaine-ftps.pem; set ssl:priority NORMAL:-VERS-TLS1.3; set ftp:ssl-force true; set ftp:ssl-protect-data true;
            set net:max-retries 3; set net:reconnect-interval-base 5; set net:timeout 30;
            mirror --reverse --no-perms --parallel=4 --verbose=1 --exclude-glob tests/ --exclude-glob var/ --exclude-glob .phpunit.cache/ --exclude-glob phpunit.xml api/ $FTP_DIR/api;
            mirror --reverse --no-perms --parallel=4 --verbose=1 --exclude-glob *.html front/dist/ $FTP_DIR;
            mirror --reverse --no-perms --parallel=4 --verbose=1 front/dist/ $FTP_DIR;
            echo '--- Contenu du dossier en ligne :'; cls -1 $FTP_DIR;
            bye"
